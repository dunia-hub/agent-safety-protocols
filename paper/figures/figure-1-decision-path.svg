<svg xmlns="http://www.w3.org/2000/svg" width="800" height="545" viewBox="0 0 800 545" role="img" aria-label="Decision path from a model response to a run label"><title>Decision path from a model response to a run label</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs><rect width="800" height="545" fill="#ffffff"/><text x="30" y="34" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="600">From a model response to a run label</text><text x="30" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="normal">Only one path produces an observation. The dashed path is what a harness without the guard does instead.</text><rect x="40" y="80" width="180" height="44" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/><text x="130.0" y="102.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">Model response</text><line x1="130" y1="124" x2="130" y2="156" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="156" width="180" height="48" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/><text x="130.0" y="180.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">Structured tool calls?</text><line x1="220" y1="180" x2="300" y2="180" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="266.0" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b">yes</text><rect x="300" y="156" width="190" height="48" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/><text x="395.0" y="180.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">Execute, log, continue</text><line x1="395" y1="156" x2="395" y2="110" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="395" y1="110" x2="230" y2="110" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="318.5" y="105.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b">next turn</text><line x1="130" y1="204" x2="130" y2="236" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="136.0" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b">no</text><rect x="40" y="236" width="180" height="48" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/><text x="130.0" y="260.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">Output cap reached?</text><line x1="220" y1="260" x2="300" y2="260" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="266.0" y="255.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b">yes</text><rect x="300" y="236" width="230" height="48" rx="6" fill="#ffffff" stroke="#9c2c2c" stroke-width="1.5"/><text x="415.0" y="253.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">truncated</text><text x="415.0" y="269.0" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b6b6b" dominant-baseline="middle">not an observation</text><line x1="130" y1="284" x2="130" y2="316" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="136.0" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b">no</text><rect x="40" y="316" width="180" height="56" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/><text x="130.0" y="337.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">Content parses as</text><text x="130.0" y="353.0" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b6b6b" dominant-baseline="middle">a tool call?</text><line x1="220" y1="344" x2="300" y2="344" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="266.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b">yes</text><rect x="300" y="316" width="230" height="56" rx="6" fill="#ffffff" stroke="#9c2c2c" stroke-width="1.5"/><text x="415.0" y="337.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">unparsed_tool_call_text</text><text x="415.0" y="353.0" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b6b6b" dominant-baseline="middle">not an observation</text><line x1="130" y1="372" x2="130" y2="404" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="136.0" y="383.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b">no</text><rect x="40" y="404" width="180" height="48" rx="6" fill="#ffffff" stroke="#1f6f43" stroke-width="1.5"/><text x="130.0" y="421.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">completed</text><text x="130.0" y="437.0" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b6b6b" dominant-baseline="middle">observation</text><rect x="560" y="156" width="200" height="48" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/><text x="660.0" y="180.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">Server error or timeout</text><line x1="660" y1="204" x2="660" y2="236" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="560" y="236" width="200" height="48" rx="6" fill="#ffffff" stroke="#9c2c2c" stroke-width="1.5"/><text x="660.0" y="253.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">transport_error</text><text x="660.0" y="269.0" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b6b6b" dominant-baseline="middle">not an observation</text><rect x="560" y="316" width="200" height="56" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/><text x="660.0" y="344.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">Runner budget reached</text><line x1="660" y1="372" x2="660" y2="404" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="560" y="404" width="200" height="48" rx="6" fill="#ffffff" stroke="#9c2c2c" stroke-width="1.5"/><text x="660.0" y="421.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">turn_limit / tool_limit</text><text x="660.0" y="437.0" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b6b6b" dominant-baseline="middle">not an observation</text><line x1="22" y1="180" x2="22" y2="478" stroke="#9c2c2c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><line x1="22" y1="478" x2="300" y2="478" stroke="#9c2c2c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="300" y="456" width="230" height="44" rx="6" fill="#ffffff" stroke="#9c2c2c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="415.0" y="471.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b1b1b" dominant-baseline="middle">no boundary crossing</text><text x="415.0" y="487.0" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b6b6b" dominant-baseline="middle">scored as a clean pass</text><text x="30" y="522" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9c2c2c" text-anchor="start" font-weight="normal">Without the guard: no recorded call is read as no attempted action.</text></svg>
