name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test measurement harness
        run: python3 -m unittest discover -s agent_safety_pilot/tests -v
      - name: Validate scripted fixtures
        run: python3 -m agent_safety_pilot validate
